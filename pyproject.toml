[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcrn"
version = "0.1.0"
description = "Regime-coupled reaction-norm fusion of molecular graphs and plaque MRI for arterial-wall penetration ranking"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.1.3",
  "scipy==1.14.1",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "torch==2.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "ruff==0.7.1",
  "black==24.10.0",
  "isort==5.13.2",
  "mypy==1.13.0",
]

[project.scripts]
rcrn-train = "rcrn.cli.train:main"
rcrn-evaluate = "rcrn.cli.evaluate:main"
rcrn-certify = "rcrn.cli.certify:main"
rcrn-transport = "rcrn.cli.transport:main"
rcrn-verify = "rcrn.cli.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "RET"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
force_sort_within_sections = false

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disable_error_code = [
  "import-untyped",
  "no-any-return",
  "arg-type",
  "return-value",
  "attr-defined",
  "name-defined",
  "assignment",
  "redundant-cast",
  "index",
]
exclude = "tests/|scripts/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
